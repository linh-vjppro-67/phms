# Mẫu triển khai: PostgreSQL + web (nhiều worker) + bộ lập lịch (1 tiến trình) + sao lưu theo yêu cầu.
# Chạy từ thư mục gốc:  docker compose -f deploy/docker-compose.yml --env-file deploy/phms.env up -d
# CHƯA kiểm chứng trong môi trường phát triển (Docker daemon không chạy). Đặt TLS/reverse proxy phía trước cổng 8000 (xem nginx.conf).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: phms
      POSTGRES_PASSWORD: ${PHMS_DB_PASSWORD:?đặt PHMS_DB_PASSWORD}
      POSTGRES_DB: phms
    command: ["postgres", "-c", "max_connections=200"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U phms"], interval: 10s, retries: 5 }

  web:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: phms.env
    environment: { PHMS_SCHEDULER: "0" }
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["docs:/data/storage"]

  scheduler:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: phms.env
    command: ["python", "-m", "app.scheduler_cli", "--loop"]
    depends_on: { db: { condition: service_healthy } }
    volumes: ["docs:/data/storage"]

  backup:                       # docker compose run --rm backup   (hoặc cron của máy chủ)
    build: { context: .., dockerfile: deploy/Dockerfile }
    profiles: ["tools"]
    env_file: phms.env
    command: ["python", "-m", "app.backup", "create", "--out", "/data/backups"]
    depends_on: { db: { condition: service_healthy } }
    volumes: ["docs:/data/storage", "backups:/data/backups"]

volumes: { pgdata: {}, docs: {}, backups: {} }
