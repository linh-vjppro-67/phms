# Mẫu reverse proxy cho PHMS (TLS + HSTS + giới hạn tốc độ đăng nhập). CHƯA kiểm chứng trong môi trường phát triển – kiểm tra bằng `nginx -t`.
limit_req_zone $binary_remote_addr zone=phms_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=phms_api:10m rate=30r/s;

upstream phms_app { server 127.0.0.1:8000; keepalive 32; }

server {
    listen 80;
    server_name phms.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name phms.example.org;

    ssl_certificate     /etc/ssl/phms/fullchain.pem;
    ssl_certificate_key /etc/ssl/phms/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 12m;           # tài liệu tối đa 10 MB (PHMS_MAX_UPLOAD_MB) + phần đệm multipart
    proxy_read_timeout 60s;

    location = /api/auth/login {
        limit_req zone=phms_login burst=5 nodelay;
        include /etc/nginx/phms_proxy.inc;
    }
    location /api/ {
        limit_req zone=phms_api burst=60 nodelay;
        include /etc/nginx/phms_proxy.inc;
    }
    location / {
        include /etc/nginx/phms_proxy.inc;
    }
}

